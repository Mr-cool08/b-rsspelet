<!doctype html>
{% from 'public_chat.html' import public_chat %}
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e171d">
    <title>Börsföretag · Stock Fight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company-standings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/lightweight-charts.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/public-chat.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/company-standings.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/company-market.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/company.js') }}"></script>
</head>
<body class="company-body">
    <header class="topbar company-topbar">
        <div class="topbar-inner">
            <a class="brand company-brand" href="/" aria-label="Stock Fight">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="brand-name">STOCK <strong>FIGHT</strong></span>
            </a>
            <div class="topbar-tools">
                <a class="company-home" href="/">
                    <span aria-hidden="true">←</span><span data-company-text="home">Huvudmeny</span>
                </a>
                <select id="language-select" class="language-select" aria-label="Språk" data-i18n-aria-label="Språk">
                    <option value="sv" lang="sv">Svenska</option>
                    <option value="en" lang="en">English</option>
                </select>
            </div>
        </div>
    </header>
    <main class="company-main" id="main">
        <p class="company-notice" id="company-notice" role="status" hidden></p>
        <div id="company-workspace" aria-busy="true">
            <div id="company-content">
                <h1 class="company-title" data-company-text="title">Börsföretag</h1>
                <p class="company-muted" data-company-text="loading" role="status">Laddar …</p>
            </div>
            <section id="company-market" class="company-panel company-market" data-company-view aria-labelledby="company-market-title" hidden></section>
            <div id="company-admin" class="company-operations" data-company-view hidden></div>
            <div id="company-reports" data-company-view hidden></div>
            <section id="company-standings" data-company-view hidden></section>
            {{ public_chat('company-chat', company_view=true) }}
        </div>
        <noscript>Börsföretag behöver JavaScript för att kunna spelas.</noscript>
    </main>
</body>
</html>
