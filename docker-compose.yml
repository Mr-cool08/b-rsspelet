name: stock-fight-app
services:
  game:
    build: .
    ports:
      - "${STOCK_FIGHT_BIND:-0.0.0.0}:${STOCK_FIGHT_PORT:-8080}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Ange SECRET_KEY i .env}"
      INVITE_CODE: "${INVITE_CODE:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      AUTO_SEED_DEMO: "${AUTO_SEED_DEMO:-1}"
      ALLOW_SYNTHETIC: "${ALLOW_SYNTHETIC:-1}"
      MARKET_TICK_SECONDS: "${MARKET_TICK_SECONDS:-3}"
      MATCH_PREVIEW_BARS: "${MATCH_PREVIEW_BARS:-12}"
      DATABASE_URL: sqlite:////app/instance/stockfight.sqlite3
    volumes:
      - stock-fight-data:/app/instance
      - ./data/imports:/app/imports:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 3
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "http://game:8000", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?Ange NGROK_AUTHTOKEN i .env}"
    depends_on:
      game:
        condition: service_healthy
    restart: unless-stopped
volumes:
  stock-fight-data:
